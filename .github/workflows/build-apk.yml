name: Build Scoreline APK

on:
  push:
    paths:
      - 'android-src.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Work out the app's web address
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "${REPO,,}" = "${OWNER}.github.io" ]; then URL="https://${OWNER}.github.io/"; else URL="https://${OWNER}.github.io/${REPO}/"; fi
          echo "APP_URL=$URL" >> "$GITHUB_ENV"
          echo "App will open $URL"

      - name: Unpack the Android project
        run: unzip -q android-src.zip -d android

      - name: Build the APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk Scoreline.apk

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Scoreline 1.0.${{ github.run_number }}
          body: Download Scoreline.apk below and open it on your phone to install or update.
          files: Scoreline.apk
          make_latest: true
