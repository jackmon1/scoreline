    : `<div class="srow"><div class="l"><b>Alert server</b><small>Connect your free alert server to get alerts with Scoreline closed, plus more team news.</small></div></div>
       <div class="srv-input"><input class="search" id="srvUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://scoreline-alerts.yourname.workers.dev"><button class="btn sm" data-act="srvconnect">Connect</button></div>`;
  el.innerHTML=`
    <div class="sec"><h2>Sports</h2><span class="meta">${S.enabled.length} shown</span></div>
    <div class="note" style="padding:0 0 8px">Only the sports you check appear in Scores, News and Rankings.</div>${fbar('sports','Find a sport')}${sports}
    <div class="sec"><h2>Favorites & alerts</h2><span class="spacer"></span><button class="btn sm" data-act="addfav">${I.plus} Add teams</button></div>
    <div class="card" style="margin-bottom:10px"><div class="srow"><div class="l"><b>Notifications</b><small>${perm==='granted'?'Allowed on this device':perm==='denied'?(NATIVE?'Turned off. Tap Allow to open notification settings.':'Blocked. Turn them on in Chrome site settings for this app.'):perm==='unsupported'?'This browser can’t show notifications.':'Not allowed yet'}</small></div>
      ${perm==='default'||(NATIVE&&perm==='denied')?'<button class="btn sm" data-act="perm">Allow</button>':''}${perm==='granted'?`<button class="sw" role="switch" data-act="nmaster" aria-checked="${S.notifOn}" aria-label="All alerts"></button>`:''}</div>
      ${server}
      ${perm==='granted'?'<div class="srow"><div class="l"><b>Send a test alert</b><small>Check that alerts reach your phone.</small></div><button class="btn sm ghost" data-act="ntest">Send test</button></div>':''}</div>
    ${favs}
    <div class="sec"><h2>Appearance</h2></div>
    <div class="card"><div class="srow"><div class="l"><b>Theme</b></div><div class="seg">${['system','light','dark'].map(t=>`<button data-act="theme" data-v="${t}" aria-pressed="${S.theme===t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div>
    <div class="srow"><div class="l"><b>Betting lines on scores</b><small>Spread and over/under under each game.</small></div><button class="sw" role="switch" data-act="odds" aria-checked="${S.showOdds}" aria-label="Betting lines on scores"></button></div>
    ${deferredInstall?'<div class="srow"><div class="l"><b>Install Scoreline</b><small>Adds it to your home screen as an app.</small></div><button class="btn sm" data-act="install">Install</button></div>':''}</div>
    <div class="sec"><h2>Data</h2></div>
    <div class="card"><div class="srow"><div class="l"><b>Clear saved data</b><small>Refreshes team lists. Your favorites stay.</small></div><button class="btn sm ghost" data-act="clearcache">Clear</button></div>
    <div class="note">Scores, stats, odds, rosters and injuries come from ESPN’s public data feeds. Team news also comes from Google News when your alert server is connected.</div></div>`;
  if(NATIVE){ try{ const d=JSON.parse(NATIVE.status()); const el2=$('#srvStat'); if(el2) el2.textContent = d.lastRun ? `Last checked ${ago(d.lastRun)==='now'?'just now':ago(d.lastRun)+' ago'}${d.liveNow?` · following ${d.liveNow} game${d.liveNow>1?'s':''} now`:''}${d.games&&!d.liveNow?` · ${d.games} upcoming game${d.games>1?'s':''} on the radar`:''}${d.lastError?' · Last problem: '+d.lastError:''}` : 'Waiting for the first check.'; }catch(e){} }
  else if(S.server) fetch(S.server+'/status').then(r=>r.json()).then(d=>{ const el=$('#srvStat'); if(!el) return;
    el.textContent = d.lastRun ? `Checked your teams ${ago(d.lastRun)==='now'?'just now':ago(d.lastRun)+' ago'}${d.watchingGames?` · watching ${d.watchingGames} game${d.watchingGames>1?'s':''}`:''}${d.lastError?' · Last problem: '+d.lastError:''}` : 'Connected. Waiting for the first check, which runs every minute.'; }).catch(()=>{ const el=$('#srvStat'); if(el) el.textContent='Can’t reach the alert server right now.'; });
}

/* ---------------- Notifications engine ---------------- */
let swReg=null;
async function notify(title, body, tag, hash){
  toast(title);
  if(!('Notification' in window) || Notification.permission!=='granted' || !S.notifOn) return;
  const opts={body, tag, icon:'icon-192.png', badge:'badge-96.png', data:{hash}};
  try{ if(swReg) await swReg.showNotification(title,opts); else new Notification(title,opts); }catch(e){}
}
const START_WORD={football:'Kickoff', basketball:'Tip-off', baseball:'First pitch', hockey:'Puck drop', soccer:'Kickoff', volleyball:'First serve', lacrosse:'Faceoff'};
let polling=false;
async function pollAlerts(){
  if(polling || !S.notifOn || S.server || NATIVE) return; polling=true;
  try{
    const snap=lsGet('sl.snap',{}), seen=lsGet('sl.seen',{});
    const watched=Object.entries(S.notif).filter(([k,v])=>Object.values(v).some(Boolean)&&S.favs.some(f=>f.lg+':'+f.id===k));
    const byLg={};
    watched.forEach(([k,v])=>{ const [lg,id]=k.split(':'); if(!LG[lg]) return; (byLg[lg]=byLg[lg]||{})[id]=v; });
    for(const [lg,teams] of Object.entries(byLg)){
      if(Object.values(teams).some(v=>v.start||v.score||v.final)){
        let d; try{ d=await loadBoard(lg, ymd(new Date())); }catch(e){ continue; }
        for(const ev of d.events||[]){
          const comp=compsOf(ev)[0]; const cs=comp?.competitors||[];
          const mine=cs.map(c=>teams[String(c.team?.id)]).filter(Boolean); if(!mine.length) continue;
          const want={start:mine.some(v=>v.start), score:mine.some(v=>v.score), final:mine.some(v=>v.final)};
          const away=cs.find(c=>c.homeAway==='away')||cs[1], home=cs.find(c=>c.homeAway==='home')||cs[0];
          const t=stateOf(comp,ev), per=(comp.status||ev.status||{}).period;
          const cur={s:t.state, a:scoreVal(away), h:scoreVal(home), p:per};
          const prev=snap[ev.id]; snap[ev.id]={...cur, at:Date.now()};
          if(!prev) continue;
          const line=`${away.team?.abbreviation} ${cur.a} – ${home.team?.abbreviation} ${cur.h}`;
          const hash=`#g-${lg}-${ev.id}`;
          if(want.start && prev.s==='pre' && cur.s==='in') notify(`${START_WORD[sportOf(LG[lg])]||'Underway'}: ${away.team?.shortDisplayName} at ${home.team?.shortDisplayName}`, tvOf(comp)?'On '+tvOf(comp):'Game is underway', ev.id, hash);
          else if(want.final && prev.s!=='post' && cur.s==='post') notify(`Final: ${line}`, ev.name||'', ev.id, hash);
          else if(want.score && cur.s==='in'){
            const periodic=['basketball','volleyball'].includes(sportOf(LG[lg]));
            if(periodic ? (prev.p && cur.p>prev.p) : (prev.a!==cur.a || prev.h!==cur.h))
              notify(line, (periodic?'End of period · ':'')+(t.shortDetail||''), ev.id, hash);
          }
        }
      }
      for(const [id,v] of Object.entries(teams)){
        if(!v.news) continue;
        let d; try{ d=await api(lg,'news',{team:id,limit:5},4*60e3); }catch(e){ continue; }
        const k=lg+':'+id, arts=(d.articles||[]).filter(a=>a.headline), prev=seen[k];
        const ids=arts.map(a=>String(a.id||a.headline));
        if(prev){ const f=S.favs.find(x=>x.lg===lg&&String(x.id)===id);
          arts.filter(a=>!prev.includes(String(a.id||a.headline))).slice(0,2).forEach(a=>notify(`${f?.short||f?.name||'Team'} news`, a.headline, 'n'+(a.id||''), `#t-${lg}-${id}`)); }
        seen[k]=[...new Set([...ids,...(prev||[])])].slice(0,40);
      }
    }
    const cutoff=Date.now()-2*864e5; for(const k in snap) if(snap[k].at<cutoff) delete snap[k];
    lsSet('sl.snap',snap); lsSet('sl.seen',seen);
  } finally { polling=false; }
}

/* ---------------- Alert server ---------------- */
function ub64(s){ s=String(s).replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const b=atob(s); return Uint8Array.from(b,c=>c.charCodeAt(0)); }
function sameKey(buf, u8){ if(!buf) return true; const a=new Uint8Array(buf); return a.length===u8.length && a.every((x,i)=>x===u8[i]); }
async function pushSub(key){
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(sub && key && !sameKey(sub.options?.applicationServerKey, key)){ await sub.unsubscribe(); sub=null; }
  if(!sub){ if(!key) key=ub64((await fetch(S.server+'/key').then(r=>r.json())).publicKey); sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:key}); }
  return sub;
}
async function connectServer(raw){
  let url=String(raw||'').trim().replace(/\/+$/,'');
  if(!url) return toast('Paste your alert server link first');
  if(!/^https?:\/\//.test(url)) url='https://'+url;
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return toast('This browser can’t receive background alerts');
  toast('Connecting…');
  try{
    const r=await fetch(url+'/key'); const k=await r.json().catch(()=>({}));
    if(!r.ok || !k.publicKey) throw new Error(k.error || 'That link isn’t a Scoreline alert server');
    if(Notification.permission!=='granted'){ const p=await Notification.requestPermission(); if(p!=='granted') throw new Error('Notifications aren’t allowed'); }
    await pushSub(ub64(k.publicKey));
    S.server=url; save();
    await syncServer(true);
    toast('Alert server connected');
  }catch(e){ S.server=S.server===url?'':S.server; save(); toast('Couldn’t connect: '+e.message); }
  render();
}
async function syncServer(strict){
  if(!S.server || !('serviceWorker' in navigator)) return;
  try{
    const sub=await pushSub();
    const teams=S.favs.filter(f=>LG[f.lg]).map(f=>({lg:f.lg, path:LG[f.lg].p, id:String(f.id), name:f.name, short:f.short||f.name, sport:sportOf(LG[f.lg]), cats:S.notif[f.lg+':'+f.id]||{}}));
    const r=await fetch(S.server+'/subscribe',{method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({sub:sub.toJSON(), teams, on:S.notifOn})});
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error || 'HTTP '+r.status);
    lsSet('sl.sync', Date.now());
  }catch(e){ if(strict) throw e; console.warn('sync', e); }
}
function alertTeams(){ return S.favs.filter(f=>LG[f.lg]).map(f=>({lg:f.lg, path:LG[f.lg].p, id:String(f.id), name:f.name, short:f.short||f.name, sport:sportOf(LG[f.lg]), cats:S.notif[f.lg+':'+f.id]||{}})); }
function syncNative(){ if(!NATIVE) return; try{ NATIVE.setConfig(JSON.stringify({teams:alertTeams(), on:S.notifOn})); }catch(e){ console.warn(e); } }
const syncSoon=(()=>{ let t; return ()=>{ clearTimeout(t); t=setTimeout(()=>{ if(NATIVE) syncNative(); else syncServer(); }, 800); }; })();
async function serverTest(){
  try{ const sub=await pushSub(); const r=await fetch(S.server+'/test',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint})});
    const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||'HTTP '+r.status);
    toast('Test sent. Lock your phone to see it arrive.'); }
  catch(e){ toast('Test failed: '+e.message); }
}
async function disconnectServer(){
  try{ const reg=await navigator.serviceWorker.ready; const sub=await reg.pushManager.getSubscription();
    if(sub){ await fetch(S.server+'/unsubscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint})}).catch(()=>{}); await sub.unsubscribe(); } }catch(e){}
  S.server=''; save(); toast('Alert server disconnected'); render();
}

/* ---------------- Events ---------------- */
document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, v=b.dataset.v;
  switch(a){
    case 'tab': if(location.hash==='#'+v) render(); else location.hash='#'+v; window.scrollTo(0,0); break;
    case 'refresh': mem.clear(); $('#view').innerHTML=''; render(); break;
    case 'day': S.day=v; $('#view').innerHTML=''; render(); break;
    case 'sf': S.scoreFilter=v; save(); $('#view').innerHTML=''; render(); break;
    case 'nmode': S.newsMode=v; save(); render(); break;
    case 'nlg': S.newsLg=v; save(); render(); break;
    case 'rl': S.rankLg=v; S.poll=0; save(); render(); break;
    case 'rp': S.poll=+v; save(); render(); break;
    case 'wk': S.wk=+v; save(); render(); break;
    case 'team': if(b.dataset.id && b.dataset.id!=='undefined') openTeam(b.dataset.lg, b.dataset.id); break;
    case 'game': if(b.dataset.id && b.dataset.id!=='undefined') openGame(b.dataset.lg, b.dataset.id); break;
    case 'close': closePanel(); break;
    case 'ptab': P.tab=v; renderPanel(); $('#panel').scrollTo({top:0}); break;
    case 'gtab': G.tab=v; renderGame(); break;
    case 'gside': G.side=v; renderGame(); break;
    case 'pf': G.pf=v; renderGame(); break;
    case 'porder': G.order=G.order==='new'?'old':'new'; renderGame(); break;
    case 'rmode': P.rmode=v; renderPanel(); break;
    case 'favt': { const t=P.team||{}; toggleFav(P.lg,{id:P.id, name:t.displayName||'Team', short:t.shortDisplayName||t.location, abbr:t.abbreviation, logo:logoOf(t), color:t.color}); renderPanel(); render(); break; }
    case 'favpick': { const t=pickerTeams.find(x=>String(x.id)===b.dataset.id && x.lg===b.dataset.lg); if(t){ toggleFav(t.lg,t); drawPicker(); } break; }
    case 'search': openSearch(); break;
    case 'sscope': SR.scope=v; document.querySelectorAll('[data-act="sscope"]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.v===v)); drawSearch(); break;
    case 'hit': pickHit(b.dataset.k); break;
    case 'hitfav': { const it=SR.items.get(b.dataset.k); if(!it) break; const t=(SR.teams||[]).find(x=>x.lg===it.lg&&String(x.id)===String(it.id))||{id:it.id,name:it.name,short:it.name,logo:it.img};
      toggleFav(it.lg,t); b.setAttribute('aria-pressed',isFav(it.lg,it.id)); b.textContent=isFav(it.lg,it.id)?'★':'☆'; break; }
    case 'player': if(b.dataset.id && b.dataset.id!=='undefined') openPlayer(b.dataset.lg, b.dataset.id); break;
    case 'addfav': openPicker(); break;
    case 'pl': PK.lg=v; document.querySelectorAll('#sheet .chip').forEach(x=>x.setAttribute('aria-pressed', x.dataset.v===v)); $('#pkList').innerHTML=skel(5,44); drawPicker(); break;
    case 'closesheet': closeSheet(); break;
    case 'sport': { const i=S.enabled.indexOf(v); if(i>=0) S.enabled.splice(i,1); else S.enabled.push(v); S.enabled.sort((x,y)=>LEAGUES.findIndex(l=>l.k===x)-LEAGUES.findIndex(l=>l.k===y)); save(); SR.teams=null; render(); break; }
    case 'ntog': { const k=b.dataset.key, c=b.dataset.cat; S.notif[k]=S.notif[k]||{}; S.notif[k][c]=!S.notif[k][c]; save(); syncSoon(); b.setAttribute('aria-pressed', S.notif[k][c]);
      if(S.notif[k][c] && notifPerm()==='default') askPerm(); break; }
    case 'perm': askPerm(); break;
    case 'nmaster': S.notifOn=!S.notifOn; save(); syncSoon(); render(); break;
    case 'battery': if(NATIVE) NATIVE.requestBattery(); break;
    case 'ntest': if(NATIVE){ NATIVE.test(); toast('Test sent'); } else if(S.server) serverTest(); else notify('Scoreline alerts are on', 'You’ll get updates for the teams and categories you picked.', 'test', '#home'); break;
    case 'srvconnect': connectServer($('#srvUrl')?.value); break;
    case 'srvoff': disconnectServer(); break;
    case 'odds': S.showOdds=!S.showOdds; save(); render(); break;
    case 'favrm': { const f=S.favs[+v]; if(f) toggleFav(f.lg,f); render(); break; }
    case 'favmv': { const i=+v, j=i+(+b.dataset.d); if(j>=0&&j<S.favs.length){ [S.favs[i],S.favs[j]]=[S.favs[j],S.favs[i]]; save(); render(); } break; }
    case 'theme': S.theme=v; save(); applyTheme(); render(); break;
    case 'install': if(deferredInstall){ deferredInstall.prompt(); deferredInstall=null; render(); } break;
    case 'clearcache': mem.clear(); try{ Object.keys(localStorage).filter(k=>k.startsWith('sl.teams.')).forEach(k=>localStorage.removeItem(k)); }catch(e){} toast('Saved data cleared'); break;
  }
});
document.addEventListener('toggle', e=>{ const el=e.target; if(!el || !el.dataset) return;
  if(el.dataset.did){ G.open=G.open||new Set(); el.open?G.open.add(el.dataset.did):G.open.delete(el.dataset.did); }
  if(el.dataset.pid){ G.openPer=G.openPer||new Set(); el.open?G.openPer.add(el.dataset.pid):G.openPer.delete(el.dataset.pid); } }, true);
document.addEventListener('change', e=>{ if(e.target.id==='dpick' && e.target.value){ S.day=e.target.value.replace(/-/g,''); $('#view').innerHTML=''; render(); } });
document.addEventListener('keydown', e=>{ if(e.key==='/' && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName||'')){ e.preventDefault(); openSearch(); return; } if((e.key==='Enter'||e.key===' ') && e.target.matches && e.target.matches('article[role="button"][data-act]')){ e.preventDefault(); e.target.click(); } });
$('#scrim').addEventListener('click',()=>{ if($('#sheet').classList.contains('on')) closeSheet(); else if(PV) closePanel(); });
async function askPerm(){ if(NATIVE){ NATIVE.requestPermission(); return; } if(!('Notification' in window)) return toast('This browser can’t show notifications');
  const r=await Notification.requestPermission(); toast(r==='granted'?'Notifications allowed':'Notifications not allowed'); if(r==='granted'){ pollAlerts(); syncSoon(); } render(); if(PV==='team') renderPanel(); }
function applyTheme(){ const r=document.documentElement; if(S.theme==='system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',S.theme); }

function route(){
  const h=location.hash.slice(1), pn=$('#panel');
  let m=/^g-([a-z0-9]+)-(\d+)$/.exec(h);
  if(m && LG[m[1]]){ if(PV!=='game' || G.lg!==m[1] || G.id!==m[2]) G={lg:m[1],id:m[2],tab:null,side:'away',live:false,pf:'key',order:null,open:null,openPer:null}; PV='game'; showPanel(); return; }
  m=/^a-([a-z0-9]+)-(\d+)$/.exec(h);
  if(m && LG[m[1]]){ A={lg:m[1],id:m[2]}; PV='player'; showPanel(); return; }
  m=/^t-([a-z0-9]+)-(\w+)$/.exec(h);
  if(m && LG[m[1]]){ if(P.lg!==m[1] || P.id!==m[2]){ P={lg:m[1],id:m[2],tab:'overview'}; delete FV.roster; delete FV.sched; } PV='team'; showPanel(); return; }
  PV=null;
  if(pn.classList.contains('on')) hidePanel();
  if(TABS.some(t=>t[0]===h) && S.tab!==h){ S.tab=h; save(); $('#view').innerHTML=''; render(); }
}
window.addEventListener('hashchange', route);
window.addEventListener('popstate', route);
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredInstall=e; if(S.tab==='settings') render(); });

/* ---------------- Boot ---------------- */
applyTheme();
S.day=ymd(new Date());
if(TABS.some(t=>t[0]===location.hash.slice(1))) S.tab=location.hash.slice(1);
else if(!/^#[tga]-/.test(location.hash)) history.replaceState(null,'','#'+S.tab);
render();
if(/^#[tga]-/.test(location.hash)) route();
if(NATIVE){
  document.documentElement.classList.add('native');
  window.scorelineOpen=h=>{ if(/^#[tga]-/.test(h)) pushPanel(h); else location.hash=h; };
  window.onNativePermission=()=>{ render(); if(PV==='team') renderPanel(); syncNative(); };
  window.onNativeResume=()=>{ if(S.tab==='settings' && !PV) render(); };
  syncNative();
}
if('serviceWorker' in navigator && !NATIVE){
  navigator.serviceWorker.register('sw.js').then(r=>{ swReg=r; if(S.server) syncServer(); }).catch(()=>{});
  navigator.serviceWorker.addEventListener('message', e=>{ const h=e.data && e.data.hash; if(!h || h[0]!=='#') return; if(/^#[tga]-/.test(h)) pushPanel(h); else location.hash=h; });
}
setTimeout(pollAlerts, 4000);
setInterval(pollAlerts, 60e3);
setInterval(()=>{ if(document.visibilityState!=='visible') return;
  if(PV==='game' && G.live) renderGame();
  else if(!PV && S.tab==='scores' && document.querySelector('.game.live,.evt.live')) render(); }, 20e3);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ const today=ymd(new Date()); if(S.day!==today && S.tab!=='scores') S.day=today; pollAlerts(); if(S.server && Date.now()-lsGet('sl.sync',0)>3600e3) syncServer(); } });
</script>
