<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scoreline</title>
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f15" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone = sticky header + bottom tab bar; unfolded (>=720px) = left rail + wide grids + side drawer for teams */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e9edf2; --ink:#0e1621; --muted:#5a6675; --line:#dde2e9;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#e3eafc;
  --live:#d92d20; --up:#0f7a55; --down:#cc3127; --warn:#b7791f; --gold:#b98900;
  --shadow:0 1px 2px rgba(14,22,33,.06),0 4px 14px rgba(14,22,33,.05);
  --f-display:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --rail:88px; --tabh:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0e14; --surface:#131920; --surface-2:#1b232d; --ink:#e7ecf2; --muted:#8a96a5; --line:#232d39;
  --accent:#6f95ff; --accent-ink:#0a0e14; --accent-soft:#1a2848;
  --live:#ff5d52; --up:#35c58e; --down:#ff6b61; --warn:#f0b54a; --gold:#e3b52c;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a0e14; --surface:#131920; --surface-2:#1b232d; --ink:#e7ecf2; --muted:#8a96a5; --line:#232d39;
  --accent:#6f95ff; --accent-ink:#0a0e14; --accent-soft:#1a2848;
  --live:#ff5d52; --up:#35c58e; --down:#ff6b61; --warn:#f0b54a; --gold:#e3b52c;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* App shell */
.app{min-height:100%;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
  padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top-row{display:flex;align-items:center;gap:12px;max-width:1180px;margin:0 auto}
.top h1{font:700 30px/1 var(--f-display);letter-spacing:.01em;margin:0;flex:1;text-transform:uppercase}
.top .sub{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.main{padding:4px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));max-width:1180px;margin:0 auto}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.icon-btn svg{width:20px;height:20px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.tab{height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .tab-pill{background:var(--accent-soft)}
.tab-pill{padding:3px 16px;border-radius:99px;display:grid;place-items:center}

@media (min-width:720px){
  .app{padding-bottom:0;padding-left:calc(var(--rail) + env(safe-area-inset-left,0px))}
  .tabs{top:0;right:auto;width:calc(var(--rail) + env(safe-area-inset-left,0px));grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start;gap:4px;
    border-top:0;border-right:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) 0 0 env(safe-area-inset-left,0px)}
  .tab{height:68px}
  .top{padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
  .main{padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
}

/* Chips & segmented */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.seg button{white-space:nowrap;height:32px;padding:0 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Date strip */
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px;scroll-snap-type:x proximity}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:52px;height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);scroll-snap-align:center}
.day b{font:700 20px/1 var(--f-display)}
.day span{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] span{color:inherit;opacity:.85}

/* Section headings */
.sec{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px}
.sec h2{font:700 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.sec .meta{color:var(--muted);font-size:12px;font-weight:500}
.sec .spacer{flex:1}
.link{color:var(--accent);font-weight:600;font-size:13px}

/* Game cards */
.grid{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.game{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;position:relative}
.game.fav{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.game.live{border-color:color-mix(in srgb,var(--live) 45%,var(--line))}
.trow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:34px}
.trow img,.logo-ph{width:28px;height:28px;object-fit:contain}
.logo-ph{border-radius:50%;background:var(--surface-2)}
.tname{display:flex;align-items:baseline;gap:6px;min-width:0;font-weight:600;font-size:15px;text-align:left}
.tname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tname .rk{font:700 13px/1 var(--f-display);color:var(--muted)}
.tname .rec{font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap}
.tname .star{color:var(--gold);font-size:12px}
.score{font:700 26px/1 var(--f-display);min-width:34px;text-align:right}
.trow.lose .tname,.trow.lose .score{color:var(--muted)}
.trow.lose .score{font-weight:600}
.gstat{grid-row:1/span 2;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:2px;min-width:74px;text-align:right;border-left:1px solid var(--line);padding-left:12px}
.gstat .st{font-weight:700;font-size:13px}
.gstat .tv{font-size:11px;color:var(--muted);font-weight:500}
.gstat .sit{font-size:11px;color:var(--muted)}
.live .gstat .st{color:var(--live)}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:5px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.livedot{animation:none}}
.lgtag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Individual-sport events */
.evt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.evt h3{margin:0 0 2px;font-size:15px;font-weight:700}
.evt .st{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:8px}
.evt.live .st{color:var(--live)}
.lb{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 10px;font-size:13px;align-items:center}
.lb .p{font:700 15px/1 var(--f-display);color:var(--muted)}
.lb .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.lb .s{font-weight:700;font-variant-numeric:tabular-nums}
.h2h{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;font-size:13px;padding:6px 0;border-top:1px solid var(--line);align-items:center}
.h2h:first-of-type{border-top:0}
.h2h .w{font-weight:700}
.h2h .r{text-align:right}
.h2h .mid{color:var(--muted);font-size:11px;font-weight:600;text-align:center}

/* Quiet "no games" line */
.quiet{color:var(--muted);font-size:13px;padding:6px 0}

/* News */
.news-lead{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.news-lead img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--surface-2)}
.news-lead .body{padding:12px 14px 14px}
.news-lead h3{font:700 24px/1.08 var(--f-display);margin:4px 0 6px;text-wrap:balance}
.news-lead p{margin:0;color:var(--muted);font-size:14px}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.nrow h3{margin:3px 0 0;font-size:15px;font-weight:600;line-height:1.3;text-wrap:pretty}
.nrow img{width:92px;height:62px;object-fit:cover;border-radius:10px;background:var(--surface-2)}
.nrow.noimg{grid-template-columns:1fr}
.nmeta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.news-cols{display:grid;gap:16px}
@media (min-width:720px){.news-cols{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}

/* Rankings */
.movers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:6px}
.mover{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.mover h4{margin:0 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mover div{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;padding:2px 0}
.mover div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rrow{display:grid;grid-template-columns:34px 46px 28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);width:100%;text-align:left}
.rrow:first-child{border-top:0}
.rrow.fav{background:color-mix(in srgb,var(--gold) 9%,var(--surface))}
.rrow .rn{font:700 22px/1 var(--f-display);text-align:center}
.rrow img{width:28px;height:28px;object-fit:contain}
.rrow .tn{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .tr{font-size:12px;color:var(--muted)}
.rrow .pts{font-size:12px;color:var(--muted);text-align:right}
.mv{font:700 14px/1 var(--f-display);display:inline-flex;align-items:center;gap:2px;justify-content:center;border-radius:6px;padding:4px 0}
.mv.up{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent)}
.mv.down{color:var(--down);background:color-mix(in srgb,var(--down) 12%,transparent)}
.mv.same{color:var(--muted)}
.mv.new{color:var(--accent);background:var(--accent-soft);font-size:12px;letter-spacing:.04em}
.dropped{margin-top:10px;font-size:13px;color:var(--muted)}

/* Home summary cards */
.wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wk-head{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.wk-head img{width:40px;height:40px;object-fit:contain}
.wk-head .t{flex:1;min-width:0}
.wk-head .t b{display:block;font:700 20px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-head .t span{font-size:12px;color:var(--muted);font-weight:500}
.wk-body{padding:10px 14px 12px;display:grid;gap:10px}
.wk-line{font-size:14px;line-height:1.45}
.res{display:grid;gap:6px}
.res-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.wl{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:700 13px/1 var(--f-display);color:#fff}
.wl.W{background:var(--up)} .wl.L{background:var(--down)} .wl.T{background:var(--muted)} .wl.N{background:var(--surface-2);color:var(--muted)}
.res-row .o{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-row .sc{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink)}
.pill.up{color:var(--up)} .pill.down{color:var(--down)}
.wk-news a{display:block;font-size:13px;font-weight:500;padding:6px 0;border-top:1px dashed var(--line)}
.wk-news a:first-child{border-top:0}

/* Empty & loading */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty h3{margin:0;font:700 22px/1.1 var(--f-display);text-transform:uppercase}
.empty p{margin:0;color:var(--muted);max-width:42ch}
.btn{white-space:nowrap;flex:none;height:42px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn svg{width:18px;height:18px;flex:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.sk{background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--r)}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.err{color:var(--muted);font-size:13px;padding:10px 0}

/* Settings */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.srow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:52px}
.srow:first-child{border-top:0}
.srow .l{flex:1;min-width:0}
.srow .l b{display:block;font-weight:600}
.srow .l small{color:var(--muted);font-size:12px}
.srow img{width:30px;height:30px;object-fit:contain}
.sw{width:46px;height:28px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.sgroup{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:14px 14px 6px}
.sports-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:0 14px 14px}
.sport{display:flex;align-items:center;justify-content:space-between;gap:8px;height:44px;padding:0 12px;border-radius:11px;border:1px solid var(--line);font-weight:600;font-size:13px;text-align:left}
.sport[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sport .ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.sport[aria-checked="true"] .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ntoggles{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px 56px}
.nt{height:30px;padding:0 11px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
.nt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.note{font-size:12px;color:var(--muted);padding:10px 14px;line-height:1.5}

/* Team panel */
.scrim{position:fixed;inset:0;background:rgba(5,8,12,.45);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.panel{position:fixed;z-index:41;inset:0;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .22s ease;overscroll-behavior:contain}
.panel.on{transform:none}
@media (min-width:720px){.panel{left:auto;width:min(560px,62vw);box-shadow:-10px 0 30px rgba(0,0,0,.18);border-left:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){.panel,.scrim{transition:none}}
.thead{--tc:#334;--tt:#fff;background:var(--tc);color:var(--tt);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.thead .bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.thead .bar .icon-btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.22);color:inherit}
.thead.lt .bar .icon-btn{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.12)}
.thead .bar .grow{flex:1}
.thead .id{display:flex;gap:14px;align-items:center}
.thead .id img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.thead h2{margin:0;font:700 32px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.thead .facts{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font-size:13px;font-weight:600;opacity:.92}
.ptabs{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none;padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px))}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex:none;height:46px;padding:0 12px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
.ptab[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
.pbody{padding:12px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.roster-g h4{margin:6px 0 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ath{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ath img,.ath .ph{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--surface-2)}
.ath .ph{display:grid;place-items:center;font:700 15px/1 var(--f-display);color:var(--muted)}
.ath b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ath small{color:var(--muted);font-size:12px}
.ath .jr{font:700 20px/1 var(--f-display);color:var(--muted);text-align:right}
.inj{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}
.inj.out{background:color-mix(in srgb,var(--down) 15%,transparent);color:var(--down)}
.inj.q{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.injrow{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:4px}
.injrow:first-child{border-top:0}
.injrow .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.injrow p{margin:0;font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kv span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kv b{font:700 22px/1.1 var(--f-display)}
.sched-row{display:grid;cursor:pointer;grid-template-columns:62px 22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.sched-row .d{color:var(--muted);font-weight:600;font-size:12px}
.sched-row img{width:22px;height:22px;object-fit:contain}
.sched-row .o{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.sched-row .r{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sched-row .r.W{color:var(--up)} .sched-row .r.L{color:var(--down)}

/* Sheet (picker) */
.sheet{position:fixed;z-index:42;left:0;right:0;bottom:0;max-height:88%;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s ease;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
@media (min-width:720px){.sheet{left:50%;right:auto;width:560px;bottom:auto;top:50%;max-height:80%;border-radius:20px;transform:translate(-50%,-40%);opacity:0;pointer-events:none}.sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}}
.sheet-h{padding:14px 16px 8px;display:grid;gap:10px}
.sheet-h .r{display:flex;align-items:center;gap:10px}
.sheet-h h3{flex:1;margin:0;font:700 22px/1 var(--f-display);text-transform:uppercase}
.search{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font:inherit;font-size:15px;width:100%;color:var(--ink)}
.sheet-list{overflow-y:auto;padding:0 16px 16px}
.pick{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.pick img{width:32px;height:32px;object-fit:contain}
.pick b{font-weight:600}
.pick small{display:block;color:var(--muted);font-size:12px}
.starbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:20px}
.starbtn[aria-pressed="true"]{color:var(--gold)}

.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;max-width:calc(100% - 32px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:720px){.toast{bottom:24px}}

/* Game cards open the game page */
.game{cursor:pointer;-webkit-user-select:none;user-select:none}
.game:active{background:var(--surface-2)}
.gline{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:3px 8px;font-size:11px;color:var(--muted);font-weight:600;border-top:1px dashed var(--line);padding-top:7px;margin-top:3px}
.gline b{color:var(--ink);font-weight:700}
button.res-row,button.sched-row{width:100%;text-align:left}
.sched-row:active,button.res-row:active{background:var(--surface-2)}

/* Game page */
.ghead{background:var(--surface);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.ghead .bar{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.ghead .bar .grow{flex:1}
.gscore{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
.gteam{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;padding:4px}
.gteam img,.gteam .logo-ph{width:52px;height:52px;object-fit:contain}
.gteam b{font:700 19px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.gteam small{color:var(--muted);font-size:12px}
.gmid{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:110px}
.gmid .sc{font:700 46px/1 var(--f-display);display:flex;gap:18px}
.gmid .sc .l{color:var(--muted)}
.gmid .st{font-weight:700;font-size:13px;text-align:center}
.gmid .when{font:700 24px/1 var(--f-display)}
.ghead.live .gmid .st{color:var(--live)}
.lines{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:12px}
table.t{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.t th{font-size:11px;font-weight:700;color:var(--muted);text-align:right;padding:7px 8px;letter-spacing:.04em;white-space:nowrap}
table.t td{padding:7px 8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
table.t tr.tot td{font-weight:700}
table.t tr.div td{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);padding:4px 8px}
table.t tr.div td:first-child{background:var(--surface-2)}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.tbl h4{margin:0;padding:10px 12px 2px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);position:sticky;left:0}
.pn{display:flex;flex-direction:column;line-height:1.2}
.pn b{font-weight:600}
.pn small{color:var(--muted);font-size:11px}
.cardp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.cardp h3{margin:0 0 10px;font:700 16px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.cmp{display:grid;gap:12px}
.cmp-row{display:grid;grid-template-columns:minmax(56px,auto) minmax(0,1fr) minmax(56px,auto);gap:4px 8px;align-items:center;font-size:13px}
.cmp-row .v{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.cmp-row .v.win{color:var(--ink);font-weight:700}
.cmp-row .v.r{text-align:right}
.cmp-row .lab{text-align:center;color:var(--muted);font-size:12px;font-weight:600}
.cmp-bar{grid-column:1/-1;display:flex;gap:3px;height:5px}
.cmp-bar i{border-radius:3px;background:var(--surface-2);display:block}
.cmp-bar i.win{background:var(--accent)}
.wp{display:grid;gap:7px}
.wp-bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.wp-bar i{display:block}
.wp-lab{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.ldr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.ldr:first-of-type{border-top:0}
.ldr .c{color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-align:center;max-width:90px}
.ldr .p{display:flex;flex-direction:column;min-width:0}
.ldr .p.r{text-align:right}
.ldr .p b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ldr .p span{color:var(--muted);font-size:12px}
.play{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start;font-size:13px}
.play:first-child{border-top:0}
.play img,.play .logo-ph{width:24px;height:24px;object-fit:contain}
.play .k{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-bottom:2px}
.play .s{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bet{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));font-size:13px;font-variant-numeric:tabular-nums;margin:0 -14px}
.bet>*{padding:9px 6px;border-top:1px solid var(--line)}
.bet>:nth-child(4n+1){padding-left:14px}
.bet .hd{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;border-top:0;text-align:center;padding-top:0}
.bet .tm{display:flex;gap:8px;align-items:center;font-weight:600;min-width:0}
.bet .tm img,.bet .tm .logo-ph{width:22px;height:22px;object-fit:contain;flex:none}
.bet .tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bet .cell{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bet .cell b{font-weight:700}
.bet .cell small{color:var(--muted);font-size:11px}
.outs{display:flex;flex-wrap:wrap;gap:6px}
.chip-out{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--surface-2)}
.kvl{display:grid;gap:0}
.info-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.info-row:first-child{border-top:0}
.info-row span:first-child{color:var(--muted)}
.info-row span:last-child{text-align:right;font-weight:600}
.fine{font-size:11px;color:var(--muted);line-height:1.5}
.ath .pos{display:inline-block;min-width:32px;font:700 13px/1 var(--f-display);letter-spacing:.04em;color:var(--accent);margin-right:4px}
.srv-input{display:flex;gap:8px;padding:0 14px 14px}
.srv-input .search{height:42px;font-size:14px}
.ok-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--up);margin-right:6px}

/* Search */
#topAct{display:flex;gap:8px;align-items:center}
.fbar{position:relative;margin:0 0 10px}
.fbar>svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.fbar input{padding-left:38px;height:40px;font-size:14px;background:var(--surface)}
.sheet .fbar input{background:var(--bg)}
.sres h5{margin:16px 0 4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.hitrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px;border-top:1px solid var(--line)}
.hit{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;align-items:center;padding:9px 0;width:100%;text-align:left;min-width:0}
.hit img,.hit .ph{width:38px;height:38px;object-fit:contain}
.hit.pl img,.hit.pl .ph{border-radius:50%;object-fit:cover;background:var(--surface-2)}
.hit .ph{display:grid;place-items:center;font:700 14px/1 var(--f-display);color:var(--muted);border-radius:50%;background:var(--surface-2)}
.hit b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit .tagx{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.sheet .seg{align-self:flex-start}
button.ath{width:100%;text-align:left}
button.ath:active,.hit:active{background:var(--surface-2)}
.pbtn{color:inherit;text-align:left;font:inherit}
.pbtn:active{opacity:.6}
.ldr .p b{color:inherit}
.thead .hs{width:84px;height:84px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.18);flex:none}
.stat-t{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
tr[data-act]{cursor:pointer}
tr[data-act]:active td{background:var(--surface-2)}
.cardp .nrow h3{font:600 15px/1.3 var(--f-body);text-transform:none;letter-spacing:0;margin:3px 0 0}
.cardp .nrow:last-child{border-bottom:0}
.datebar{display:flex;gap:6px;align-items:flex-start}
.datebar .days{flex:1;min-width:0}
.day.cal{position:relative;overflow:hidden;cursor:pointer;color:var(--accent)}
.day.cal svg{width:20px;height:20px}
.day.cal span{color:var(--accent)}
.day.cal input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.day.m1{box-shadow:inset 3px 0 0 var(--accent)}
.day.m1 span{color:var(--accent)}
/* Play-by-play */
.pp-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.pp-sum{font-size:12px;color:var(--muted);font-weight:600;margin-top:-4px}
.pp-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pp-per{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;list-style:none}
summary.pp-per{cursor:pointer}
summary.pp-per::-webkit-details-marker,.drive summary::-webkit-details-marker{display:none}
summary.pp-per::after{content:'›';font-size:18px;color:var(--muted);transition:transform .15s;margin-left:6px}
details[open]>summary.pp-per::after{transform:rotate(90deg)}
.pp-per .sc{font-variant-numeric:tabular-nums;color:var(--muted);margin-left:auto}
.pp{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;padding:10px 12px 10px 8px;border-top:1px solid var(--line);font-size:13px;line-height:1.4;align-items:start;border-left:4px solid transparent}
.pp-per+.pp,summary+.pp,details>div>.pp:first-child{border-top:0}
.pp.s{border-left-color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,var(--surface))}
.pp.s .pp-text{font-weight:600}
.pp.b{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.pp.m{color:var(--muted);font-size:12px;padding-top:6px;padding-bottom:6px}
.pp-time{display:flex;flex-direction:column;font-variant-numeric:tabular-nums;font-size:12px}
.pp-time b{font-weight:700}
.pp-time small{color:var(--muted);font-size:11px}
.pp-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px;align-items:center}
.pp-tags img,.pp-tags .logo-ph{width:18px;height:18px}
.tg{display:inline-block;font:700 11px/1 var(--f-display);letter-spacing:.06em;padding:3px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tg.s{background:var(--ink);color:var(--bg)}
.tg.b{background:var(--accent);color:var(--accent-ink)}
.tg.t{background:var(--down);color:#fff}
.tg.y{background:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--warn)}
.pp-dd{font-size:11px;color:var(--muted);margin-top:2px}
.pp-sc{font:700 17px/1.1 var(--f-display);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.drive+.drive{border-top:1px solid var(--line)}
.drive summary{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;list-style:none}
.drive summary img,.drive summary .logo-ph{width:24px;height:24px}
.dsum{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;min-width:0}
.dsum b{font-weight:700}
.dsum small{flex-basis:100%;color:var(--muted);font-size:12px}
.drive[open]>summary{background:var(--surface-2)}
.chev{font-size:20px;color:var(--muted);transition:transform .15s}
details[open]>summary .chev{transform:rotate(90deg)}
</style>

function collectTeams(obj, out=new Map(), depth=0){
  if(!obj || typeof obj!=='object' || depth>12) return out;
  if(Array.isArray(obj)){ for(const x of obj) collectTeams(x,out,depth+1); return out; }

  if(t && typeof t==='object' && t.id && (t.displayName||t.name||t.location) && !out.has(String(t.id))) out.set(String(t.id), t);
  for(const k in obj){ const v=obj[k]; if(v && typeof v==='object' && k!=='team') collectTeams(v,out,depth+1); }
  return out;
}

async function teamsList(lg){

  const L=LG[lg], found=new Map(), errs=[];
  const sources=[
    ()=>api(lg,'teams',{limit:1000},864e5),
    ()=>api(lg,'teams',{},864e5),
    ()=>getJSON('https://site.api.espn.com/apis/v2/sports/'+L.p+'/standings'),
    ()=>api(lg,'scoreboard',L.q||{},10*60e3),
    ()=>L.rk?api(lg,'rankings',{},10*60e3):null,
  ];
  for(const src of sources){
    try{ const d=await src(); if(d) collectTeams(d,found); }catch(e){ errs.push(e.message); }
    if(found.size>=(L.col?100:10)) break;
  }
  if(!found.size) throw new Error(errs[0]||'No teams found');
  const v=[...found.values()].map(t=>({id:String(t.id), name:t.displayName||[t.location,t.name].filter(Boolean).join(' ')||t.name, short:t.shortDisplayName||t.location||t.displayName||t.name, abbr:t.abbreviation||'', logo:logoOf(t), color:t.color}))
    .filter(t=>t.name).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  if(v.length>=(L.col?100:10)) lsSet(ck,{t:Date.now(),v});
  return v;
}

function numv(x){ if(x==null||x==='') return null; if(typeof x==='number') return isFinite(x)?x:null;
  const s=String(x).trim().toLowerCase(); if(/^(even|ev)$/.test(s)) return 100; if(/^(pk|pick|pick'em|pickem)$/.test(s)) return 0;
  const n=parseFloat(s.replace(/^[ou]\s*/,'')); return isNaN(n)?null:n; }
const firstOf=(...xs)=>xs.find(x=>x!=null&&x!=='');
const fmtOdds=x=>{ const n=numv(x); return n==null?'—':(n>0?'+'+n:String(n)); };
const fmtLine=v=>v==null?'—':(v===0?'PK':(v>0?'+'+v:String(v)));
const implied=ml=>ml==null?null:(ml<0?-ml/(-ml+100):100/(ml+100));
const pct=p=>Math.round(p*100)+'%';
const abbrOf=c=>c?.team?.abbreviation||c?.team?.shortDisplayName||'';
function normOdds(o, away, home){
  if(!o || typeof o!=='object') return null;
  const ps=o.pointSpread||{}, ml=o.moneyline||{}, tot=o.total||{}, H=o.homeTeamOdds||{}, A=o.awayTeamOdds||{};
  const abA=abbrOf(away).toUpperCase(), abH=abbrOf(home).toUpperCase();
  let spread=null;
  const m=/^\s*([A-Za-z0-9&.'\- ]+?)\s+([+-]?\d+(?:\.\d+)?)\s*$/.exec(o.details||'');
  if(m){ const ab=m[1].trim().toUpperCase(), v=parseFloat(m[2]); if(ab===abH) spread=v; else if(ab===abA) spread=-v; }
  if(spread==null && /^\s*(even|pk|pick)/i.test(o.details||'')) spread=0;
  if(spread==null) spread=numv(firstOf(ps.home?.close?.line, H.current?.pointSpread?.american, H.current?.pointSpread?.alternateDisplayValue));
  if(spread==null && o.spread!=null){ spread=numv(o.spread); if(spread!=null){ if(H.favorite===true&&spread>0) spread=-spread; if(A.favorite===true&&spread<0) spread=-spread; } }
  const r={ provider:o.provider?.displayName||o.provider?.name||'', providerId:o.provider?.id, details:o.details||'', spread,
    spreadOpen:numv(firstOf(ps.home?.open?.line, H.open?.pointSpread?.american, H.open?.pointSpread?.alternateDisplayValue)),
    hSp:firstOf(H.spreadOdds, ps.home?.close?.odds, H.current?.spread?.american), aSp:firstOf(A.spreadOdds, ps.away?.close?.odds, A.current?.spread?.american),
    hML:numv(firstOf(H.moneyLine, ml.home?.close?.odds, H.current?.moneyLine?.american)), aML:numv(firstOf(A.moneyLine, ml.away?.close?.odds, A.current?.moneyLine?.american)),
    hMLOpen:numv(firstOf(ml.home?.open?.odds, H.open?.moneyLine?.american)), aMLOpen:numv(firstOf(ml.away?.open?.odds, A.open?.moneyLine?.american)),
    total:numv(firstOf(o.overUnder, tot.over?.close?.line, o.current?.total?.american, o.current?.total?.alternateDisplayValue)),
    totalOpen:numv(firstOf(tot.over?.open?.line, o.open?.total?.american, o.open?.total?.alternateDisplayValue, o.open?.overUnder?.american)),
    oOdds:firstOf(o.overOdds, tot.over?.close?.odds, o.current?.over?.american), uOdds:firstOf(o.underOdds, tot.under?.close?.odds, o.current?.under?.american) };
  if(r.spread==null && r.total==null && r.hML==null && r.aML==null) return null;
  return r;
}
function betResult(o, as, hs, aName, hName){
  const out={};
  if(!o || isNaN(as) || isNaN(hs)) return out;
  if(o.spread!=null){ const adj=hs+o.spread-as;
    if(adj===0) out.ats={short:'Push', long:`Push against the spread`, live:'Right on the number'};
    else { const who=adj>0?hName:aName, line=adj>0?o.spread:-o.spread;
      out.ats={short:`${who} covered`, long:`${who} covered ${fmtLine(line)} by ${Math.abs(adj)}`, live:`${who} covering ${fmtLine(line)}`}; } }
  if(o.total!=null){ const sum=as+hs;
    out.tot = sum===o.total ? {short:'Total push', long:`Total pushed at ${o.total}`}
      : sum>o.total ? {short:`Over ${o.total}`, long:`Over hit: ${sum} points vs ${o.total}`, live:`${sum} scored, over by ${+(sum-o.total).toFixed(1)}`}
      : {short:`Under ${o.total}`, long:`Under hit: ${sum} points vs ${o.total}`, live:`${sum} scored, ${+(o.total-sum).toFixed(1)} to the over`}; }
  return out;
}
function oddsLine(o, away, home, state){
  if(!o) return '';
  const parts=[];
  if(o.spread!=null){ const fav=o.spread<0?home:o.spread>0?away:null; parts.push(fav?`<b>${esc(abbrOf(fav))} ${fmtLine(-Math.abs(o.spread))}</b>`:'<b>Pick’em</b>'); }
  else if(o.hML!=null && o.aML!=null) parts.push(`ML <b>${esc(abbrOf(away))} ${fmtOdds(o.aML)}</b> <b>${esc(abbrOf(home))} ${fmtOdds(o.hML)}</b>`);
  if(o.total!=null) parts.push(`O/U <b>${o.total}</b>`);
  if(state!=='pre'){ const res=betResult(o, parseFloat(scoreVal(away)), parseFloat(scoreVal(home)), abbrOf(away), abbrOf(home));
    if(state==='post'){ if(res.ats) parts.push(esc(res.ats.short)); if(res.tot) parts.push(esc(res.tot.short)); }
    else if(res.ats) parts.push(esc(res.ats.live)); }
  return parts.length?`<div class="gline">${parts.join('<span aria-hidden="true">·</span>')}</div>`:'';
}

function eventCard(lg, ev){
  const comps=compsOf(ev); const c0=comps[0];
  const t=stateOf(c0,ev), live=t.state==='in';
  const nm = c => c?.athlete?.displayName || c?.athlete?.shortName || c?.team?.displayName || c?.roster?.shortDisplayName || '—';
  let body='';
  const big = comps.find(c=>(c.competitors||[]).length>2);
  if(big){
    const list=[...big.competitors].sort((a,b)=>(a.order??a.sortOrder??999)-(b.order??b.sortOrder??999)).slice(0,6);
    const st=stateOf(big,ev);
    body=`<div class="lb">${list.map((c,i)=>`<span class="p">${esc(c.status?.position?.displayName || c.order || i+1)}</span><span class="n">${esc(nm(c))}</span><span class="s">${st.state==='pre'?'':esc(scoreVal(c) || c.statistics?.[0]?.displayValue || '')}</span>`).join('')}</div>`;
  } else {
    const shown=comps.filter(c=>(c.competitors||[]).length===2);
    const order=[...shown].sort((a,b)=>{const r=x=>({in:0,post:1,pre:2})[stateOf(x,ev).state]??3; return r(a)-r(b);});
    body=order.slice(0,6).map(c=>{
      const [a,b]=c.competitors; const st=stateOf(c,ev);
      const sets = x => (x.linescores||[]).map(l=>l.value).join(' ');
      return `<div class="h2h"><span class="${a.winner?'w':''}">${esc(nm(a))}</span>
        <span class="mid">${st.state==='post'?esc(sets(a)&&sets(b)?sets(a)+' / '+sets(b):(st.shortDetail||'Final')):st.state==='in'?'LIVE':esc(fmtTime(c.date||ev.date))}</span>
        <span class="r ${b.winner?'w':''}">${esc(nm(b))}</span></div>`;
    }).join('') + (order.length>6?`<div class="quiet">+${order.length-6} more</div>`:'');
  }
  return `<article class="evt${live?' live':''}" data-f="scores" data-q="${esc((ev.name||'')+' '+(ev.shortName||'')+' '+LG[lg].n)}"><h3>${esc(ev.shortName||ev.name)}</h3>
    <div class="st">${live?'<span class="livedot"></span>':''}${esc(t.state==='pre'?fmtDay(ev.date)+' · '+fmtTime(ev.date):(t.shortDetail||t.detail||''))}</div>${body}</article>`;
}

function dayStrip(){
  const today=new Date(); today.setHours(12,0,0,0);
  const sel=new Date(+S.day.slice(0,4), +S.day.slice(4,6)-1, +S.day.slice(6), 12);
  const off=Math.round((sel-today)/864e5);
  const from=Math.min(-30, off-7), to=Math.max(120, off+14);
  let out='';
  for(let i=from;i<=to;i++){ const d=new Date(today); d.setDate(today.getDate()+i); const k=ymd(d);
    const lab = i===0?'Today':i===-1?'Yest':i===1?'Tmrw':(d.getDate()===1||i===from)?d.toLocaleDateString([], {month:'short'}):d.toLocaleDateString([], {weekday:'short'});
    out+=`<button class="day${d.getDate()===1&&Math.abs(i)>1?' m1':''}" data-act="day" data-v="${k}" ${S.day===k?'aria-pressed="true"':''} id="d${k}" aria-label="${esc(d.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'}))}"><span>${lab}</span><b>${d.getDate()}</b></button>`; }
  const iso=`${S.day.slice(0,4)}-${S.day.slice(4,6)}-${S.day.slice(6)}`;
  const away=S.day!==ymd(today);
  return `<div class="datebar"><label class="day cal" title="Pick any date">${I.cal}<span>Date</span><input type="date" id="dpick" value="${iso}" aria-label="Pick any date"></label>
    ${away?`<button class="day" data-act="day" data-v="${ymd(today)}" aria-label="Back to today"><span>Back to</span><b style="font-size:14px">Today</b></button>`:''}
    <div class="days" id="days">${out}</div></div>`;
}

function normArt(a, tm){ return {id:'e'+(a.id||a.headline), h:a.headline, d:a.description||'', url:a.links?.web?.href||a.links?.mobile?.href||'', img:a.images?.[0]?.url||'', t:a.published||a.lastModified, src:'ESPN', tm}; }
const taggedFor=(a,id)=>(a.categories||[]).some(c=>String(c.teamId??c.team?.id??'')===String(id));
function newsQuery(f){
  const L=LG[f.lg], sp=sportOf(L);
  const word = L.k==='csoft' ? 'softball' : ({football:'football',basketball:'basketball',baseball:'baseball',hockey:'hockey',soccer:'soccer',volleyball:'volleyball',lacrosse:'lacrosse'}[sp]||'');
  return L.col ? `"${f.name}" ${/^Women/.test(L.n)?"women's ":''}${word}` : `"${f.name}"`;

async function googleNews(q){
  if(S.server && !NATIVE) return getURL(S.server+'/news?q='+encodeURIComponent(q),10*60e3);
  const key='gn:'+q, hit=mem.get(key); if(hit?.d && Date.now()-hit.t<10*60e3) return hit.d;
  const xml=await nativeGet('https://news.google.com/rss/search?q='+encodeURIComponent(q+' when:7d')+'&hl=en-US&gl=US&ceid=US:en');
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  const items=[...doc.querySelectorAll('item')].slice(0,30).map(it=>{ const tx=s=>(it.querySelector(s)?.textContent||'').trim(); const src=tx('source'); let t=tx('title'); if(src && t.endsWith(' - '+src)) t=t.slice(0,-(src.length+3)); const d=Date.parse(tx('pubDate')); return {title:t, link:tx('link'), source:src, published:isNaN(d)?null:new Date(d).toISOString()}; });
  const d={items}; mem.set(key,{t:Date.now(),d}); return d;
}
async function teamNews(f, n=20){
  const tm=f.short||f.name;
  const jobs=[api(f.lg,'news',{team:f.id,limit:50},5*60e3).then(d=>(d.articles||[]).filter(a=>a.headline&&taggedFor(a,f.id)).map(a=>normArt(a,tm)))];
  if((S.server||NATIVE) && f.name) jobs.push(googleNews(newsQuery(f)).then(d=>(d.items||[]).filter(x=>x.title&&x.link).map(x=>({id:'g'+x.link, h:x.title, d:'', url:x.link, img:'', t:x.published, src:x.source||'News', tm}))));
  const res=await Promise.allSettled(jobs);
  const seen=new Set(), out=[];
  res.forEach(r=>{ if(r.status==='fulfilled') r.value.forEach(a=>{ const k=String(a.h).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,50); if(!seen.has(k)){ seen.add(k); out.push(a); } }); });
  out.sort((a,b)=>new Date(b.t||0)-new Date(a.t||0));
  return out.slice(0,n);
}

}

async function rankFor(lg, id){
  if(!LG[lg].rk) return null;
  try{ const d=await api(lg,'rankings',{},10*60e3); const p=(d.rankings||[]).find(x=>x.ranks?.length); if(!p) return null;

}

/* ---------------- Team helpers & weekly summary ---------------- */
function gameInfo(ev, teamId){
  const c=ev.competitions?.[0]; if(!c) return null;
  const cs=c.competitors||[];
  const me=cs.find(x=>String(x.id??x.team?.id)===String(teamId)) || cs.find(x=>String(x.team?.id)===String(teamId));
  const op=cs.find(x=>x!==me); if(!me||!op) return null;
  const st=stateOf(c,ev);
  const ms=scoreVal(me), os=scoreVal(op);
  let res=null;
  if(st.state==='post' && ms!==''){
    if(me.winner===true) res='W'; else if(op.winner===true) res='L';
    else { const a=parseFloat(ms), b=parseFloat(os); res = isNaN(a)||isNaN(b) ? null : a>b?'W':a<b?'L':'T'; }
  }
  return {ev, c, st, date:new Date(ev.date), me, op, ms, os, res, home:me.homeAway==='home', neutral:c.neutralSite,
    opName:op.team?.shortDisplayName||op.team?.displayName||op.team?.location||'TBD', opId:op.team?.id, opLogo:logoOf(op.team), opRank:rankOf(op), tv:tvOf(c)};
}
const vsAt = g => g.neutral ? 'vs' : g.home ? 'vs' : 'at';
function weekRange(off){ const now=new Date(); const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()); const dow=(d.getDay()+6)%7; const s=new Date(d); s.setDate(d.getDate()-dow+7*off); const e=new Date(s); e.setDate(s.getDate()+7); return [s,e]; }
async function schedule(f){ const d=await api(f.lg,`teams/${f.id}/schedule`,{},10*60e3); return {team:d.team||{}, games:(d.events||[]).map(ev=>gameInfo(ev,f.id)).filter(Boolean).sort((a,b)=>a.date-b.date)}; }
const VERB = {W:'Beat', L:'Lost to', T:'Tied'};
async function summaryCard(f, off){
  const [s,e]=weekRange(off);
  const [sch, news, rk] = await Promise.allSettled([schedule(f), teamNews(f,2), rankFor(f.lg,f.id)]);
  const games = sch.status==='fulfilled' ? sch.value.games : [];
  const tm = sch.status==='fulfilled' ? sch.value.team : {};
  const inWk = games.filter(g=>g.date>=s && g.date<e);
  const played = inWk.filter(g=>g.st.state==='post');
  const upcoming = games.filter(g=>g.st.state!=='post' && g.date>=new Date(Date.now()-5*3600e3));
  const next = upcoming[0];
  const w=played.filter(g=>g.res==='W').length, l=played.filter(g=>g.res==='L').length, t=played.filter(g=>g.res==='T').length;
  const rec = tm.recordSummary || '';
  const r = rk.status==='fulfilled' ? rk.value : null;

async function depthStarters(byId){
  const L=LG[P.lg], sport=sportOf(L), order=POS_ORDER[sport];
  if(L.col || !order) return null;
  for(const y of seasonYears(P.lg)){
    let d; try{ d=await getURL(coreURL(P.lg,`seasons/${y}/teams/${P.id}/depthcharts`),3600e3); }catch(e){ continue; }
    const items=d?.items||[]; if(!items.length) continue;
    const groups=[], sides=new Set(), used=new Set();
    for(const it of items){
      const list=[];
      for(const [key,p] of Object.entries(it.positions||{})){
        const pos=String(p.position?.abbreviation||key).toUpperCase();
        const ath=[...(p.athletes||[])].sort((a,b)=>(a.rank??a.slot??0)-(b.rank??b.slot??0))[0];
        const aid=String(ath?.athlete?.id || (/athletes\/(\d+)/.exec(ath?.athlete?.$ref||'')||[])[1] || '');
        if(aid && byId.has(aid)) list.push({aid,pos,key});
      }
      if(!list.length) continue;
      let side='Starters';
      if(sport==='football'){ const off=list.filter(x=>FB_OFF.test(x.pos)).length, st=list.filter(x=>FB_ST.test(x.pos)).length; side = st>list.length/2?'Special teams':off>list.length/2?'Offense':'Defense'; }
      if(sides.has(side)) continue; sides.add(side);
      const keep=list.filter(x=>!used.has(x.aid) && (side!=='Special teams' || /^(PK|K|P)$/.test(x.pos)));
      keep.forEach(x=>used.add(x.aid));
      const rank=x=>{ const i=order.indexOf(x.pos); return i<0?999:i; };
      keep.sort((a,b)=>rank(a)-rank(b) || a.key.localeCompare(b.key,undefined,{numeric:true}));
      groups.push({label:side, players:keep.map(x=>playerFrom({id:x.aid}, byId, x.pos))});
    }
    const ord=['Offense','Defense','Special teams','Starters'];
    groups.sort((a,b)=>ord.indexOf(a.label)-ord.indexOf(b.label));
    if(groups.some(g=>g.players.length)) return {src:'From the current depth chart', how:'Ordered by position importance', groups};
  }
  return null;
}

/* Turns ESPN's play data into one list, tagging scores, big plays and lead changes */
function buildPlays(d, lg, away, home){
  const sport=sportOf(LG[lg]), aid=String(away.team?.id), hid=String(home.team?.id);
  let raw=[];
  if(sport==='football' && (d.drives?.previous?.length || d.drives?.current)){
    const drives=[...(d.drives.previous||[])]; const cur=d.drives.current;
    if(cur && !drives.some(x=>String(x.id)===String(cur.id))) drives.push(cur);
    drives.forEach((dr,di)=>(dr.plays||[]).forEach(p=>raw.push({p, drive:dr, di, cur: cur && String(cur.id)===String(dr.id)})));
  } else if(Array.isArray(d.plays) && d.plays.length) raw=d.plays.map(p=>({p}));
  else if(d.keyEvents?.length) raw=d.keyEvents.map(p=>({p}));
  else if(d.scoringPlays?.length) raw=d.scoringPlays.map(p=>({p}));
  let pa=0, ph=0, lead=0; const out=[];
  raw.forEach(({p,drive,di,cur},i)=>{
    const text=String(p.text||p.shortText||p.type?.text||'').trim(); if(!text) return;
    const tt=String(p.type?.text||''), both=tt+' '+text;
    const a=numv(p.awayScore), hh=numv(p.homeScore);
    let pts=0, by=null;
    if(a!=null && hh!=null){ if(a>pa){ pts=a-pa; by=aid; } else if(hh>ph){ pts=hh-ph; by=hid; } }
    const scoring=!!p.scoringPlay || pts>0;
    if(scoring && !by && p.team?.id) by=String(p.team.id);
    let lc=false;
    if(a!=null && hh!=null){ const nl=Math.sign(a-hh); if(nl!==0 && lead!==0 && nl!==lead) lc=true; if(nl!==0) lead=nl; pa=a; ph=hh; }
    const tags=[]; let big=false, key=false, minor=false;
    const tag=(t,c)=>tags.push({t,c});
    if(sport==='football'){
      const yds=numv(p.statYardage);
      if(/touchdown/i.test(both)){ tag('TD','s'); big=true; }
      else if(scoring && /field goal/i.test(both)) tag('FG','s');
      else if(scoring && /safety/i.test(both)){ tag('SAFETY','s'); big=true; }
      else if(scoring && /two-point|2pt|conversion/i.test(both)) tag('2PT','s');
      else if(scoring && /extra point|kick\)/i.test(both)) tag('PAT','s');
      if(/interception/i.test(both)){ tag('INT','t'); big=true; }
      if(/fumble/i.test(both) && /(opponent|lost|recovered by)/i.test(both) && !/own/i.test(tt)){ tag('FUMBLE','t'); big=true; }
      if(/blocked/i.test(both)){ tag('BLOCKED','t'); big=true; }
      if(/turnover on downs/i.test(both)){ tag('ON DOWNS','t'); big=true; }
      if(yds!=null && yds>=20 && !/punt|kickoff|penalty|field goal/i.test(tt)){ tag(`+${yds} YDS`,'b'); big=true; }
      if(/sack/i.test(both)) tag('SACK','n');
      if(/penalty/i.test(tt) || /PENALTY/.test(text)) tag('FLAG','y');
      if(+p.start?.down===4 && /rush|pass/i.test(tt) && yds!=null && yds>=(+p.start?.distance||99)){ tag('4TH DOWN','b'); big=true; }
      if(/end (of )?(period|quarter|half|game)|timeout|two-minute/i.test(tt)) minor=true;
    } else if(sport==='basketball'){
      if(scoring && pts===3){ tag('3PT','s'); big=true; }
      if(scoring && /dunk|alley oop/i.test(text)){ tag('DUNK','s'); big=true; }
      if(!scoring && /block/i.test(both)) tag('BLOCK','n');
      if(/steal/i.test(text)) tag('STEAL','n');
      if(/end (of )?(period|quarter|half|game)|timeout/i.test(tt)) minor=true;
    } else if(sport==='hockey'){
      if(scoring || /^goal/i.test(tt)){ tag('GOAL','s'); big=true; }
      if(/penalty/i.test(tt)){ tag('PENALTY','y'); key=true; }
      if(/fight/i.test(text)){ tag('FIGHT','t'); key=true; }
      if(!scoring && /shot|faceoff|hit|stoppage|giveaway|takeaway|blocked|miss/i.test(tt)) minor=true;
    } else if(sport==='baseball'){
      if(/grand slam/i.test(text)){ tag('GRAND SLAM','s'); big=true; }
      else if(/homered|home run/i.test(text)){ tag('HR','s'); big=true; }
      if(/triple play/i.test(text)){ tag('TRIPLE PLAY','b'); big=true; }
      else if(/double play/i.test(text)){ tag('DP','b'); key=true; }
      if(/struck out|strikes out/i.test(text)) tag('K','n');
      if(/^(ball|strike|foul|pitch)/i.test(tt)) minor=true;
    } else if(sport==='soccer'){
      if(/goal/i.test(tt) && !/kick|disallow/i.test(tt)){ tag('GOAL','s'); big=true; }
      if(/red card/i.test(tt)){ tag('RED CARD','t'); big=true; }
      else if(/yellow card/i.test(tt)){ tag('YELLOW','y'); key=true; }
      if(/penalty/i.test(tt)){ tag('PENALTY','b'); key=true; }
      if(/substitution/i.test(tt)) minor=true;
    }
    if(lc){ tag('LEAD CHANGE','b'); big=true; }
    if(scoring && !tags.some(x=>x.c==='s')) tag(pts?`+${pts}`:'SCORE','s');
    out.push({ id:String(p.id||i), per:+(p.period?.number||0), perDisp:p.period?.displayValue||'', clock:p.clock?.displayValue||'', text, scoring, by, pts, a, h:hh, tags, big,
      key: sport==='basketball' ? big : (key||big||scoring), minor: minor && !scoring && !big, drive, di, cur, down:p.start?.downDistanceText||p.start?.shortDownDistanceText||'' });
  });
  return out;
}
function playRow(x, lg, away, home){

    <div class="pp-sc">${x.scoring&&x.a!=null?`${esc(x.a)}–${esc(x.h)}`:''}</div></div>`;

function tabPlayByPlay(list, d, lg, away, home, t){
  const live=t.state==='in', mode=G.pf||'key', sport=sportOf(LG[lg]);
  if(!G.order) G.order = live ? 'new' : 'old';
  const newest=G.order==='new';
  const nScore=list.filter(x=>x.scoring).length, nBig=list.filter(x=>x.big&&!x.scoring).length, nLead=list.filter(x=>x.tags.some(g=>g.t==='LEAD CHANGE')).length;
  const keyName = sport==='basketball' ? 'Big plays' : 'Key plays';

  // Football "All plays": one card per drive
  if(sport==='football' && mode==='all' && rows.some(x=>x.drive)){
    if(!G.open) G.open=new Set(rows.filter(x=>x.cur).map(x=>'d'+x.di));
    const drives=[]; rows.forEach(x=>{ let g=drives.find(y=>y.di===x.di); if(!g){ g={di:x.di, dr:x.drive||{}, items:[]}; drives.push(g); } g.items.push(x); });

      const meta=[dr.offensivePlays!=null?`${dr.offensivePlays} plays`:`${g.items.length} plays`, dr.yards!=null?`${dr.yards} yds`:'', dr.timeElapsed?.displayValue||''].filter(Boolean).join(' · ');
      const start=dr.start?.period?.number?`${perLabel(lg,dr.start.period.number)} ${dr.start.clock?.displayValue||''}`:'';

      return `<details class="drive" data-did="d${g.di}" ${G.open.has('d'+g.di)?'open':''}><summary>${img(logoOf(tm.team||dr.team))}
        <span class="dsum"><b>${esc(abbrOf(tm)||dr.team?.abbreviation||'')}</b> ${res?`<span class="tg ${rc}">${esc(res.toUpperCase())}</span>`:''}<small>${esc([start,meta].filter(Boolean).join(' · '))}</small></span>
        <span class="chev" aria-hidden="true">›</span></summary><div>${items.map(x=>playRow(x,lg,away,home)).join('')}</div></details>`; }).join('')}</div>`;
  }
  // Everything else: grouped by quarter / period / inning
  const groups=new Map(); rows.forEach(x=>{ const k=x.per||0; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(x); });
  const endScore=new Map(); list.forEach(x=>{ if(x.a!=null && x.h!=null) endScore.set(x.per||0,[x.a,x.h]); });
  let keys=[...groups.keys()].sort((a,b)=>a-b); if(newest) keys.reverse();
  const latest=Math.max(...keys);
  if(mode==='all' && !G.openPer) G.openPer=new Set([String(latest)]);
  return ctl+keys.map(k=>{ const items=newest?[...groups.get(k)].reverse():groups.get(k); const es=endScore.get(k);

    const body=items.map(x=>playRow(x,lg,away,home)).join('');
    return mode==='all'
      ? `<details class="pp-group" data-pid="${k}" ${G.openPer.has(String(k))?'open':''}><summary class="pp-per">${head}</summary>${body}</details>`
      : `<div class="pp-group"><div class="pp-per">${head}</div>${body}</div>`;
  }).join('');
}

async function renderGame(){
  const id=++panelId, lg=G.lg, eid=G.id, pn=$('#panel');
  const alive=()=>id===panelId && G.id===eid && PV==='game';
  if(pn.dataset.view!=='g'+lg+eid){ pn.dataset.view='g'+lg+eid; pn.scrollTop=0;
    pn.innerHTML=`<div class="ghead"><div class="bar"><button class="icon-btn" data-act="close" aria-label="Back">${I.back}</button></div><div class="sk" style="height:100px"></div></div><div class="pbody">${skel(3,90)}</div>`; }
  let d;
  try{ d=await api(lg,'summary',{event:eid},15e3); }
  catch(e){ if(alive()) pn.querySelector('.pbody').innerHTML=`<div class="err">Couldn't load this game. Check your connection and try again. (${esc(e.message)})</div>`; return; }
  if(!alive()) return;
  const comp=d.header?.competitions?.[0]||{}; const cs=comp.competitors||[];
  const away=cs.find(c=>c.homeAway==='away')||cs[1]||{}, home=cs.find(c=>c.homeAway==='home')||cs[0]||{};
  const t=comp.status?.type||{}, live=t.state==='in', pre=t.state==='pre', post=t.state==='post';
  G.live=live;
  const odds=gameOdds(d, away, home, comp);
  const plays=pre?[]:buildPlays(d, lg, away, home);
  const hasBox=(d.boxscore?.players||[]).some(p=>(p.statistics||[]).some(s=>(s.athletes||[]).some(a=>a.stats?.length)));
  const tabs = pre ? [['bet','Betting'],['info','Preview']]
    : [['stats','Stats'], plays.length&&['plays','Plays'], hasBox&&['box','Box score'], ['bet','Betting'], ['info','Info']].filter(Boolean);
  if(!G.tab || !tabs.some(x=>x[0]===G.tab)) G.tab = pre ? (odds?'bet':'info') : (live && plays.length ? 'plays' : 'stats');
  const nm=c=>c.team?.shortDisplayName||c.team?.displayName||c.team?.location||'';
  const rk=c=>{ const r=c.rank||c.curatedRank?.current; return r&&r<=25?`<span style="color:var(--muted)">${r} </span>`:''; };
  const rec=c=>(c.record||c.records||[])[0]?.summary||(c.record||c.records||[])[0]?.displayValue||'';
  const lose=c=>post && c.winner===false;
  const teamBtn=c=>`<button class="gteam" data-act="team" data-lg="${lg}" data-id="${esc(c.team?.id)}">${img(logoOf(c.team))}<b>${rk(c)}${esc(nm(c))}</b><small>${esc(rec(c))}</small></button>`;
  const tv=(comp.broadcasts||[]).map(b=>b.media?.shortName).filter(Boolean)[0]||'';

    : `<div class="gmid"><div class="sc num"><span class="${lose(away)?'l':''}">${esc(scoreVal(away))}</span><span class="${lose(home)?'l':''}">${esc(scoreVal(home))}</span></div><span class="st">${live?'<span class="livedot"></span>':''}${esc(t.shortDetail||t.detail||'')}</span></div>`;
  const n=Math.max((away.linescores||[]).length,(home.linescores||[]).length);
  const ls = n && !pre ? `<div class="lines"><table class="t"><thead><tr><th></th>${Array.from({length:n},(_,i)=>`<th>${esc(perLabel(lg,i+1).replace(/^[QPH](\d)$/,'$1'))}</th>`).join('')}<th>T</th></tr></thead><tbody>${[away,home].map(c=>`<tr><td><b>${esc(abbrOf(c))}</b></td>${Array.from({length:n},(_,i)=>`<td>${esc(c.linescores?.[i]?.displayValue??c.linescores?.[i]?.value??'')}</td>`).join('')}<td><b>${esc(scoreVal(c))}</b></td></tr>`).join('')}</tbody></table></div>` : '';
  let body='';
  if(G.tab==='stats') body=tabStats(d, away, home, t);
  else if(G.tab==='box') body=tabBox(d, away, home);
  else if(G.tab==='plays') body=tabPlayByPlay(plays, d, lg, away, home, t);
  else if(G.tab==='bet') body=await tabBet(d, away, home, t, odds);
  else body=tabInfo(d, comp, away, home, t);
  if(!alive()) return;
  const keep=pn.scrollTop;
  pn.innerHTML=`<div class="ghead${live?' live':''}"><div class="bar"><button class="icon-btn" data-act="close" aria-label="Back">${I.back}</button><span class="grow"></span><span class="lgtag">${esc(LG[lg].n)}</span>${searchBtn()}</div>
      <div class="gscore">${teamBtn(away)}${mid}${teamBtn(home)}</div>${ls}</div>
    <div class="ptabs">${tabs.map(([k,l])=>`<button class="ptab" data-act="gtab" data-v="${k}" aria-pressed="${G.tab===k}">${l}</button>`).join('')}</div>
    <div class="pbody">${body}</div>`;
  pn.scrollTop=keep;
  applyFilters();
}

let SR={q:'', seq:0, scope:'all', teams:null, players:null, items:new Map(), espn:null, espnQ:''};
const UID_LEAGUE={28:'nfl',23:'cfb',46:'nba',41:'mcbb',54:'wcbb',59:'wnba',10:'mlb',90:'nhl',770:'mls'};
const LEAGUE_BY_SLUG=Object.fromEntries(LEAGUES.map(l=>[l.p.split('/')[1], l.k]));
function parseSearch(d){
  const out=[], seen=new Set();
  const walk=(o,depth)=>{
    if(!o || typeof o!=='object' || depth>8) return;
    if(Array.isArray(o)){ o.forEach(x=>walk(x,depth+1)); return; }
    const name=o.displayName||o.name;
    const link=o.link?.web || (typeof o.link==='string'?o.link:'') || o.links?.web?.href || (Array.isArray(o.links)?o.links[0]?.href:'') || o.href || '';
    const m=/espn\.com\/([a-z0-9.-]+)\/(player|team)\/(?:[a-z-]+\/)?_\/id\/(\d+)/i.exec(link||'');
    let type = m ? m[2].toLowerCase() : (/^(player|athlete)$/i.test(o.type||'') ? 'player' : /^team$/i.test(o.type||'') ? 'team' : (/~a:\d+/.test(o.uid||'')?'player':/~t:\d+$/.test(o.uid||'')?'team':null));
    if(type==='athlete') type='player';
    if(name && type && typeof name==='string'){
      const id=String(m?m[3]:(/~[at]:(\d+)/.exec(o.uid||'')||[])[1]||o.id||'').replace(/\D/g,'');
      const slug=o.defaultLeagueSlug||o.leagueSlug||(typeof o.league==='string'?o.league:o.league?.slug)||(m?m[1]:'');
      const lg=LEAGUE_BY_SLUG[slug]||UID_LEAGUE[(/~l:(\d+)/.exec(o.uid||'')||[])[1]]||null;
      const key=type+(lg||slug)+id;
      if(id && !seen.has(key)){ seen.add(key);
        out.push({type, lg, id, name, sub:o.subtitle||o.description||o.team?.displayName||(lg?LG[lg].n:''), img:o.image?.default||o.image?.href||(typeof o.image==='string'?o.image:'')||o.images?.[0]?.url||o.headshot?.href||o.logo||'', url:link}); }
    }
    for(const k in o){ const v=o[k]; if(v && typeof v==='object') walk(v,depth+1); }
  };
  walk(d,0);
  return out;
}
async function espnSearch(q){
  const e=encodeURIComponent(q);
  for(const u of [`https://site.web.api.espn.com/apis/search/v2?query=${e}&limit=20`, `https://site.web.api.espn.com/apis/common/v3/search?query=${e}&limit=20&mode=prefix`]){
    try{ const items=parseSearch(await getURL(u,5*60e3)); if(items.length) return items; }catch(err){}
  }
  return [];
}
async function loadSearchIndex(){
  if(!SR.teams){

    const lgs=[...new Set([...enabledLeagues().filter(l=>l.t).map(l=>l.k), ...S.favs.map(f=>f.lg)])].filter(k=>LG[k]);
    await Promise.allSettled(lgs.map(k=>teamsList(k).then(v=>{ SR.teams.push(...v.map(t=>({...t, lg:k}))); drawSearch(true); })));

function hitRow(it){

  const pl=it.type==='player';

    : `<a class="hit${pl?' pl':''}" href="${esc(it.url||'#')}" target="_blank" rel="noopener">${inner}</a>`;
  const star = !pl && it.lg && LG[it.lg]?.t ? `<button class="starbtn" data-act="hitfav" data-k="${esc(k)}" aria-pressed="${isFav(it.lg,it.id)}" aria-label="Favorite ${esc(it.name)}">${isFav(it.lg,it.id)?'★':'☆'}</button>` : '';
  return `<div class="hitrow">${main}${star}</div>`;
}
let searchTimer=null;
function drawSearch(fromIndex){
  const box=$('#sres'); if(!box) return;
  const q=SR.q.trim(), nq=norm(q);
  if(nq.length<2){
    if(fromIndex) return;
    const rec=lsGet('sl.recent',[]);
    box.innerHTML=(rec.length?`<div class="sres"><h5>Recent</h5>${rec.map(hitRow).join('')}</div>`:'')
      +(S.favs.length?`<div class="sres"><h5>Your teams</h5>${S.favs.map(f=>hitRow({type:'team',lg:f.lg,id:String(f.id),name:f.name,sub:LG[f.lg]?.n||'',img:f.logo})).join('')}</div>`:'')
      +`<div class="note" style="padding:14px 0">Type at least two letters to search teams in the sports you follow and players across ESPN.</div>`;
    return;
  }
  const words=nq.split(/\s+/);
  const has=s=>{ const t=norm(s); return words.every(w=>t.includes(w)); };
  const rankT=t=>(norm(t.name).startsWith(nq)||norm(t.short).startsWith(nq)||norm(t.abbr)===nq?0:2)-(isFav(t.lg,t.id)?1:0);
  let teams=SR.scope==='players'?[]:(SR.teams||[]).filter(t=>has(`${t.name} ${t.short} ${t.abbr} ${LG[t.lg].n} ${short(LG[t.lg])}`)).sort((a,b)=>rankT(a)-rankT(b)||a.name.localeCompare(b.name)).slice(0,20)
    .map(t=>({type:'team',lg:t.lg,id:String(t.id),name:t.name,sub:LG[t.lg].n,img:t.logo}));
  let players=SR.scope==='teams'?[]:(SR.players||[]).filter(p=>has(p.name)).slice(0,10);
  const espn = SR.espnQ===q ? SR.espn : null;
  if(espn){
    const tk=new Set(teams.map(t=>t.lg+':'+t.id)), pk=new Set(players.map(p=>p.lg+':'+p.id));
    if(SR.scope!=='players') teams=teams.concat(espn.filter(x=>x.type==='team' && !tk.has(x.lg+':'+x.id)).slice(0,8));
    if(SR.scope!=='teams') players=players.concat(espn.filter(x=>x.type==='player' && !pk.has(x.lg+':'+x.id)).slice(0,15));
  }
  const loading=!espn;
  box.innerHTML=(teams.length?`<div class="sres"><h5>Teams</h5>${teams.map(hitRow).join('')}</div>`:'')
    +(SR.scope!=='teams'?`<div class="sres"><h5>Players</h5>${players.map(hitRow).join('')}${loading?'<div class="quiet">Searching all players…</div>':''}</div>`:'')
    +(!loading && !teams.length && !players.length?`<div class="empty" style="margin-top:12px"><h3>No matches</h3><p>Check the spelling, or turn on more sports in Settings to search their teams.</p></div>`:'');
  if(fromIndex || (espn && SR.espnQ===q)) return;
  clearTimeout(searchTimer); const seq=++SR.seq;
  searchTimer=setTimeout(async()=>{ const res=await espnSearch(q).catch(()=>[]); if(seq!==SR.seq) return; SR.espn=res; SR.espnQ=q; drawSearch(true); }, 300);
}
